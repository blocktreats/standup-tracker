<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapyUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-gradient"></div>

  <!-- Loading State -->
  <div id="loading">
    <div class="loader">
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
    </div>
    <p>Connecting...</p>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <header>
      <div class="header-top">
        <div class="header-brand">
          <div class="brand-icon">
            <img src="capy-su.png" alt="" width="24" height="24">
          </div>
          <h1>CapyUp</h1>
        </div>
        <span id="timer" class="timer hidden">00:00</span>
      </div>
      <div class="add-participant">
        <input type="text" id="add-name-input" placeholder="Add participant..." maxlength="50" autocomplete="off">
        <button id="add-name-btn" class="btn-add" title="Add">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="participant-list"></main>

    <footer id="actions"></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.gstatic.com/meetjs/addons/1.1.0/meet.addons.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
